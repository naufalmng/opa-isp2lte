# OPA-ISP2LTE configuration
# Di-edit lewat: oitl config set <KEY> <VALUE>  (atau edit manual)
# Format: KEY=VALUE  (baris kosong & komentar # diabaikan)
#
# CATATAN: komentar inline (VALUE  # catatan) sekarang AMAN — parser
# memotong komentar dan merapikan spasi. Versi lama memasukkannya ke nilai
# sehingga `INTERVAL=10  # detik` membuat `sleep` gagal dan loop jadi spin.

# ===== JALUR =====
# Interface jalur utama (ISP)
PRIMARY=enx00e04c8f6956
# Interface jalur cadangan (modem LTE)
BACKUP=enx0202025b3531

# Gateway tiap jalur
PRIMARY_GW=192.168.100.1
BACKUP_GW=192.168.200.1

# ===== DETEKSI =====
# Target ICMP (pisahkan dengan spasi)
PING_TARGETS=8.8.8.8 1.1.1.1

# Mode probe: auto | tcp | icmp
#   auto = TCP (curl) authoritative, ICMP fallback kalau curl tidak ada
#   tcp  = TCP saja
#   icmp = ICMP saja (v1 behaviour, tidak disarankan: ICMP bisa di-block
#          upstream padahal data normal, atau hidup padahal data mati)
PROBE_MODE=auto

# URL probe TCP — HTTPS wajib, harus mengembalikan 2xx/3xx tanpa auth
TCP_PROBE_URL=https://www.cloudflare.com/cdn-cgi/trace

# Substring yang WAJIB ada di body respons.
# Ini penangkal captive portal: modem tanpa pulsa sering menjawab
# /generate_204 secara lokal sehingga jalur mati terlihat sehat. Body di balik
# TLS yang valid tidak bisa dipalsukan tanpa MITM bersertifikat.
TCP_PROBE_EXPECT=fl=

# Ukuran body minimal (byte). 204 kosong = tidak cukup bukti.
TCP_PROBE_MIN_BYTES=20

# Timeout probe (detik)
PROBE_TIMEOUT=4

# ===== TIMING =====
# Detak (detik) antar cek
INTERVAL=10
# Gagal berturut-turut -> switch
FAIL_THRESHOLD=3
# PRIMARY stabil segini detik baru failback
FAILBACK_HOLD=60
# Jeda minimal antar switch (anti bolak-balik / thrash)
SWITCH_COOLDOWN=20
# Jeda minimal antar permintaan reconnect NetworkManager
RECOVERY_COOLDOWN=60

# ===== ROUTE =====
# Metric route milik opa. Route NetworkManager harus LEBIH BESAR dari ini.
# opa TIDAK PERNAH menghapus route milik NetworkManager.
ROUTE_METRIC=50

# 0 = monitor-only (jangan sentuh tabel route sama sekali)
MANAGE_ROUTES=1

# 1 = wajib probe BACKUP sebelum switch ke LTE.
# WAJIB 1 kalau SIM LTE bisa habis kuota / tanpa pulsa — kalau tidak,
# failover akan memindahkan trafik ke jalur yang mati (outage, bukan redundancy).
VERIFY_BACKUP=1

# ===== TAILSCALE =====
# 1 = restart tailscaled tiap switch (v1 selalu begini -> tailscale thrash)
RESTART_TAILSCALE=0
# Jeda minimal antar restart tailscaled (detik)
TAILSCALE_RESTART_COOLDOWN=300

# ===== LOG =====
LOGFILE=/var/log/opa-isp2lte.log
