# OPA-ISP2LTE configuration
# Di-edit lewat: oitl config set <KEY> <VALUE>  (atau edit manual)
# Format: KEY=VALUE  (baris kosong & komentar # diabaikan)

# Interface jalur utama (ISP)
PRIMARY=enx00e04c8f6956
# Interface jalur cadangan (modem LTE)
BACKUP=enx0202025b3531

# Gateway tiap jalur
PRIMARY_GW=192.168.100.1
BACKUP_GW=192.168.200.1

# Target deteksi internet (pisahkan dengan spasi)
PING_TARGETS=8.8.8.8 1.1.1.1

# Detak (detik) antar cek
INTERVAL=10
# Gagal berturut-turut -> switch
FAIL_THRESHOLD=3
# PRIMARY stabil segini detik baru failback
FAILBACK_HOLD=60

# File log
LOGFILE=/var/log/opa-isp2lte.log
